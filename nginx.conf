server {
  # Os dois: o entrypoint do nginx só acrescenta o `listen [::]:80` quando o
  # default.conf é o de fábrica — como este é nosso, ele não mexe. E
  # `localhost` dentro do Alpine resolve `::1` antes do IPv4: sem a linha de
  # baixo, o healthcheck leva "Connection refused" pra sempre (mesmo defeito
  # já visto no deploy da acquario-site).
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  absolute_redirect off;

  # CACHE: o que tem hash no nome (/assets/index-XXXX.js) guarda pra sempre —
  # o hash muda quando o conteúdo muda. O que não tem hash (index.html,
  # favicon, PDFs, fontes, imagens de public/) só guarda sob confirmação
  # (`no-cache`: manda o ETag, servidor decide 304 ou conteúdo novo).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
